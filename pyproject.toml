[tool.poetry]
name = "meanderx"
version = "0.1.0"
description = "MeanderX - Con Edison ArcGIS ingestion foundation (phase 1)"
authors = ["me <me@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
pydantic = "^2.5.0"
pydantic-settings = "^2.2.0"
httpx = "^0.24.0"
sqlalchemy = "^2.0.0"
alembic = "^1.11.0"
psycopg = {extras = ["binary"], version = "^3.1.0"}
geoalchemy2 = "^0.13.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.3.0"
pytest-asyncio = "^0.23.0"
python-dotenv = "^1.0.0"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
