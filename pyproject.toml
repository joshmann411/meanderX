[tool.poetry]
name = "meanderx"
version = "0.1.0"
description = "MeanderX - Con Edison ArcGIS ingestion foundation (phase 1)"
authors = ["me <me@example.com>"]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.95.0"
uvicorn = {extras = ["standard"], version = "^0.22.0"}
pydantic = "^2.5.0"
httpx = "^0.24.0"
sqlalchemy = "^2.0.0"
alembic = "^1.11.0"
psycopg-binary = "^3.1.0"

[tool.poetry.dev-dependencies]
pytest = "^7.3.0"
pytest-asyncio = "^0.22.0"
python-dotenv = "^1.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
